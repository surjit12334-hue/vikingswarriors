<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Two Vertical Partitions</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #000;
    }

    /* ---------- Header ---------- */
    .site-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1.5rem;
      color: #f9fafb;
      border-bottom: 1px solid #374151;
    }

    .site-header__logo {
      height: 64px;
      display: block;
      flex: 0 0 auto;
    }

    .site-header__wordmark {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ---------- Split ---------- */
    .split {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
    }

    .pane {
      flex: 1 1 50%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .pane--left {
      background: #1f2937;
      color: #f9fafb;
    }

    .pane--right {
      background: #f9fafb;
      color: #1f2937;
      border-left: 1px solid #d1d5db;
    }

    .pane h2 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
    }

    .pane p {
      margin: 0;
      opacity: 0.8;
    }

    @media (max-width: 480px) {
      .site-header {
        padding: 0.5rem 1rem;
      }

      .site-header__logo {
        height: 48px;
      }

      .site-header__wordmark {
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <img
      class="site-header__logo"
      src="assets/viking-emblem.png"
      alt="Monochrome Viking warrior emblem"
    />
    <h1 class="site-header__wordmark">Vikings Warriors</h1>
  </header>

  <main class="split">
    <section class="pane pane--left" aria-label="Left partition">
      <h2>Left</h2>
      <p>50% width</p>
    </section>
    <section class="pane pane--right" aria-label="Right partition">
      <h2>Right</h2>
      <p>50% width</p>
    </section>
  </main>
</body>
</html>
